<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Finder · 听歌识曲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --mint: #5eead4;
    --sky: #7dd3fc;
    --mint-deep: #14b8a6;
    --sky-deep: #0ea5e9;
    --cream: #f0fdfa;
    --ink: #1e293b;
    --ink-soft: #64748b;
    --white: #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 50%, #dbeafe 100%);
    min-height: 100vh;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* ============ 背景图案层：波点 + 云朵 ============ */
  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-decor::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(94, 234, 212, 0.35) 0%, transparent 25%),
      radial-gradient(circle at 80% 70%, rgba(125, 211, 252, 0.35) 0%, transparent 25%),
      radial-gradient(circle at 50% 100%, rgba(167, 243, 208, 0.4) 0%, transparent 30%);
  }
  .bg-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(20, 184, 166, 0.18) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    animation: float 12s ease-in-out infinite;
  }
  .blob.b1 { width: 320px; height: 320px; background: #5eead4; top: -80px; left: -80px; }
  .blob.b2 { width: 260px; height: 260px; background: #7dd3fc; top: 40%; right: -100px; animation-delay: -4s; }
  .blob.b3 { width: 300px; height: 300px; background: #a7f3d0; bottom: -100px; left: 30%; animation-delay: -8s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.08); }
  }

  /* ============ 主容器 ============ */
  .page {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ============ 顶部标题 ============ */
  .header { text-align: center; margin-bottom: 40px; }
  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 20px rgba(20, 184, 166, 0.15);
    font-size: 14px;
    font-weight: 600;
    color: var(--mint-deep);
    margin-bottom: 20px;
  }
  .logo-badge .emoji { font-size: 18px; }
  .title {
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 16px;
    background: linear-gradient(120deg, #14b8a6 0%, #0ea5e9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 16px;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ============ 卡片通用 ============ */
  .card {
    background: var(--white);
    border-radius: 28px;
    padding: 32px;
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 12px 40px rgba(20, 184, 166, 0.1);
    border: 1px solid rgba(94, 234, 212, 0.3);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .card-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--mint-deep);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
  .card-label::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--mint-deep);
  }

  /* ============ 上传区 ============ */
  .drop {
    border: 2.5px dashed #99f6e4;
    background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 100%);
    border-radius: 22px;
    padding: 56px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .drop:hover, .drop.drag {
    border-color: var(--mint-deep);
    background: linear-gradient(135deg, #ccfbf1 0%, #cffafe 100%);
    transform: scale(1.01);
  }
  .drop-icon {
    font-size: 48px;
    margin-bottom: 16px;
    display: inline-block;
    animation: bounce 2.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .drop-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .drop-sub {
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ============ 文件信息 ============ */
  .file-pill {
    display: none;
    align-items: center;
    gap: 12px;
    background: #f0fdfa;
    border: 1.5px solid #99f6e4;
    border-radius: 16px;
    padding: 14px 18px;
    margin-top: 16px;
    font-size: 14px;
  }
  .file-pill.active { display: flex; }
  .file-pill .icon { font-size: 20px; }
  .file-pill .name {
    flex: 1;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink);
  }
  .file-pill .size {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: ui-monospace, monospace;
  }

  /* ============ 主按钮 ============ */
  .btn-main {
    width: 100%;
    padding: 18px 24px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #5eead4 0%, #7dd3fc 100%);
    color: #0f172a;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 20px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 24px rgba(20, 184, 166, 0.25);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .btn-main:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(20, 184, 166, 0.35);
  }
  .btn-main:active:not(:disabled) { transform: translateY(0); }
  .btn-main:disabled {
    background: #e2e8f0;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ============ 状态提示 ============ */
  .status {
    display: none;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 14px;
    margin-top: 16px;
    text-align: center;
    font-weight: 500;
  }
  .status.active { display: block; animation: fadeIn 0.3s; }
  .status.processing {
    background: #ecfeff;
    color: #0e7490;
    border: 1px solid #a5f3fc;
  }
  .status.error {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* ============ 结果展示 ============ */
  .result {
    display: none;
    margin-top: 24px;
    text-align: center;
  }
  .result.active { display: block; animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
  }

  .vinyl {
    width: 160px;
    height: 160px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, #1e293b 0%, #1e293b 30%, #334155 31%, #1e293b 32%, #1e293b 40%, #334155 41%, #1e293b 42%, #1e293b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 12px 32px rgba(20, 184, 166, 0.3);
    animation: spin 8s linear infinite paused;
  }
  .result.active .vinyl { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .vinyl::after {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .vinyl-label {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 0 0 6px #1e293b;
    position: relative;
    z-index: 2;
  }
  .result-song {
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .result-artist {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .result-score {
    display: inline-block;
    background: linear-gradient(135deg, #d1fae5, #cffafe);
    color: #0f766e;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
  }

  /* ============ 聊天区 ============ */
  .chat-log {
    max-height: 260px;
    overflow-y: auto;
    padding: 4px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-log::-webkit-scrollbar { width: 6px; }
  .chat-log::-webkit-scrollbar-thumb { background: #99f6e4; border-radius: 3px; }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: fadeIn 0.3s;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    overflow: hidden;
  }
  /* 👇 皮卡丘头像容器 */
  .msg.agent .avatar {
    background: radial-gradient(circle at 50% 40%, #fef08a 0%, #facc15 70%, #eab308 100%);
    border: 2px solid #fde047;
    box-shadow: 0 2px 8px rgba(234, 179, 8, 0.35);
  }
  .msg.agent .avatar svg {
    width: 30px;
    height: 30px;
  }
  .msg.user .avatar { background: #e2e8f0; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
  }
  .msg.agent .bubble {
    background: #fefce8;
    border: 1.5px solid #fde68a;
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #5eead4, #7dd3fc);
    color: #0f172a;
    border-top-right-radius: 4px;
    font-weight: 500;
  }

  .chat-input-row {
    display: flex;
    gap: 10px;
    background: #f8fafc;
    border-radius: 18px;
    padding: 6px;
    border: 1.5px solid #e2e8f0;
    transition: border-color 0.2s;
  }
  .chat-input-row:focus-within { border-color: var(--mint-deep); }
  .chat-input-row input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    font-family: inherit;
  }
  .chat-input-row input::placeholder { color: #94a3b8; }
  .chat-input-row input:disabled { cursor: not-allowed; }
  .chat-send {
    border: none;
    background: linear-gradient(135deg, #5eead4, #7dd3fc);
    color: #0f172a;
    font-weight: 700;
    font-size: 14px;
    padding: 0 24px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .chat-send:hover:not(:disabled) { transform: scale(1.03); }
  .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============ 网格：两栏布局 ============ */
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  /* ============ 页脚 ============ */
  .footer {
    text-align: center;
    padding: 32px 0 8px;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .page { padding: 32px 16px 60px; }
    .card { padding: 24px; }
  }
</style>
</head>
<body>

<div class="bg-decor">
  <div class="bg-dots"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="page">

  <header class="header">
    <div class="logo-badge">
      <span class="emoji">🎧</span>
      <span>Song Finder</span>
    </div>
    <h1 class="title">听出每首歌<br>背后的故事</h1>
    <p class="subtitle">上传一段音频，让 AI 帮你识别歌曲，探索它的创作背景，或推荐相似风格的音乐。</p>
  </header>

  <div class="layout">

    <!-- 左：识别 -->
    <div class="card">
      <div class="card-label">识别歌曲</div>

      <div class="drop" id="drop">
        <div class="drop-icon">🎵</div>
        <div class="drop-title">点击或拖拽上传音频</div>
        <div class="drop-sub">支持 mp3 · wav · m4a</div>
        <input type="file" id="fileInput" accept="audio/*" hidden>
      </div>

      <div class="file-pill" id="filePill">
        <span class="icon">📁</span>
        <span class="name" id="fileName"></span>
        <span class="size" id="fileSize"></span>
      </div>

      <button class="btn-main" id="submitBtn" disabled>
        <span>🔍</span>
        <span>开始识别</span>
      </button>

      <div class="status" id="status"></div>

      <div class="result" id="result">
        <div class="vinyl">
          <div class="vinyl-label" id="vinylLabel">♪</div>
        </div>
        <div class="result-song" id="rSongName">—</div>
        <div class="result-artist" id="rArtist">—</div>
        <div class="result-score">匹配度 <span id="rScore">—</span></div>
      </div>
    </div>

    <!-- 右：聊天 -->
    <div class="card" style="display: flex; flex-direction: column;">
      <div class="card-label">小皮卡 · AI 助手</div>

      <div class="chat-log" id="chatLog">
        <div class="msg agent">
          <div class="avatar" id="pkInitial"></div>
          <div class="bubble">皮卡皮卡！上传一首歌，我来告诉你它的故事，或者推荐相似的音乐 ⚡</div>
        </div>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="等待识别结果..." disabled>
        <button class="chat-send" id="chatSend" disabled>发送</button>
      </div>
    </div>

  </div>

  <footer class="footer">
    © 2026 Song Finder · Powered by LangGraph & Kafka
  </footer>

</div>

<script>
// ============ 皮卡丘 SVG（黄色圆脸 + 尖耳朵 + 红腮 + 黑眼睛 + 小嘴） ============
const PIKACHU_SVG = `
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 左耳 -->
  <path d="M14 4 L24 22 L10 26 Z" fill="#facc15" stroke="#a16207" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 左耳尖黑色 -->
  <path d="M14 4 L19 12 L14 13 Z" fill="#1f2937"/>
  <!-- 右耳 -->
  <path d="M50 4 L40 22 L54 26 Z" fill="#facc15" stroke="#a16207" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 右耳尖黑色 -->
  <path d="M50 4 L45 12 L50 13 Z" fill="#1f2937"/>
  <!-- 脸部 -->
  <ellipse cx="32" cy="40" rx="21" ry="18" fill="#facc15" stroke="#a16207" stroke-width="1.5"/>
  <!-- 左红腮 -->
  <circle cx="18" cy="44" r="4" fill="#fb923c" opacity="0.75"/>
  <!-- 右红腮 -->
  <circle cx="46" cy="44" r="4" fill="#fb923c" opacity="0.75"/>
  <!-- 左眼 -->
  <ellipse cx="24" cy="36" rx="2.5" ry="3.5" fill="#1f2937"/>
  <circle cx="24.8" cy="35" r="1" fill="#fff"/>
  <!-- 右眼 -->
  <ellipse cx="40" cy="36" rx="2.5" ry="3.5" fill="#1f2937"/>
  <circle cx="40.8" cy="35" r="1" fill="#fff"/>
  <!-- 鼻子/嘴 -->
  <ellipse cx="32" cy="43" rx="1.6" ry="1" fill="#1f2937"/>
  <path d="M29 46 Q32 49 35 46" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
`;

// ============ 状态 ============
let selectedFile = null;
let currentSong = null;

// ============ DOM ============
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const filePill = document.getElementById('filePill');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatLog = document.getElementById('chatLog');

// 首页皮卡丘头像注入
document.getElementById('pkInitial').innerHTML = PIKACHU_SVG;

// ============ 上传交互 ============
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', (e) => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file) return;
  if (file.size > 30 * 1024 * 1024) {
    showStatus('文件过大，请上传小于 30MB 的音频', 'error');
    return;
  }
  selectedFile = file;
  fileName.textContent = file.name;
  fileSize.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
  filePill.classList.add('active');
  submitBtn.disabled = false;
  resultEl.classList.remove('active');
  clearStatus();

  // 重置聊天（皮卡丘）
  currentSong = null;
  chatInput.disabled = true;
  chatSend.disabled = true;
  chatInput.placeholder = '等待识别结果...';
  chatLog.innerHTML = `<div class="msg agent"><div class="avatar">${PIKACHU_SVG}</div><div class="bubble">皮卡皮卡！上传一首歌，我来告诉你它的故事，或者推荐相似的音乐 ⚡</div></div>`;
}

function showStatus(text, type = 'processing') {
  statusEl.className = 'status active ' + type;
  statusEl.textContent = text;
}
function clearStatus() { statusEl.className = 'status'; }

// ============ 提交识别 ============
submitBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  submitBtn.disabled = true;
  showStatus('⏳ 正在分析音频指纹...');
  resultEl.classList.remove('active');

  const fd = new FormData();
  fd.append('file', selectedFile);

  try {
    const res = await fetch('/recognize', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('服务器错误 ' + res.status);
    const data = await res.json();
    if (data.session_id) pollResult(data.session_id);
  } catch (err) {
    showStatus('请求失败：' + err.message, 'error');
    submitBtn.disabled = false;
  }
});

async function pollResult(sid) {
  let n = 0;
  const timer = setInterval(async () => {
    n++;
    try {
      const res = await fetch('/result/' + sid);
      const data = await res.json();
      if (data.status === 'completed') { clearInterval(timer); showResult(data.result); }
      else if (data.status === 'error') { clearInterval(timer); showStatus('识别出错：' + (data.error || '未知'), 'error'); submitBtn.disabled = false; }
      else if (n > 40) { clearInterval(timer); showStatus('处理超时，请重试', 'error'); submitBtn.disabled = false; }
    } catch (err) {
      clearInterval(timer);
      showStatus('查询结果失败', 'error');
      submitBtn.disabled = false;
    }
  }, 1500);
}

// 颜色池（用于唱片标签）
const PALETTE = [
  'linear-gradient(135deg, #5eead4, #14b8a6)',
  'linear-gradient(135deg, #7dd3fc, #0ea5e9)',
  'linear-gradient(135deg, #a7f3d0, #34d399)',
  'linear-gradient(135deg, #bae6fd, #38bdf8)',
  'linear-gradient(135deg, #99f6e4, #2dd4bf)',
];

function pickColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return PALETTE[Math.abs(h) % PALETTE.length];
}

function showResult(result) {
  if (!result || !result.song_name) {
    showStatus('未识别到歌曲，请尝试其他片段', 'error');
    submitBtn.disabled = false;
    return;
  }
  clearStatus();
  currentSong = result.song_name;

  document.getElementById('rSongName').textContent = result.song_name;
  document.getElementById('rArtist').textContent = result.artist || '未知歌手';
  document.getElementById('rScore').textContent = result.match_score || '—';

  const lbl = document.getElementById('vinylLabel');
  lbl.textContent = result.song_name.charAt(0).toUpperCase();
  lbl.style.background = pickColor(result.song_name);

  resultEl.classList.add('active');
  submitBtn.disabled = false;

  // 解锁聊天
  chatInput.disabled = false;
  chatSend.disabled = false;
  chatInput.placeholder = `对《${result.song_name}》提问...`;

  setTimeout(() => {
    addMsg('agent', `皮卡皮卡！识别到《${result.song_name}》啦！想了解它的创作故事，还是让我推荐几首相似风格的歌？⚡`);
  }, 400);
}

// ============ 聊天 ============
function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatarHTML = role === 'agent' ? PIKACHU_SVG : '🙂';
  div.innerHTML = `<div class="avatar">${avatarHTML}</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendChat() {
  const msg = chatInput.value.trim();
  if (!msg) return;
  addMsg('user', msg);
  chatInput.value = '';
  chatSend.disabled = true;
  chatSend.textContent = '...';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, current_song: currentSong || '' })
    });
    const data = await res.json();
    addMsg('agent', data.reply);
  } catch (err) {
    addMsg('agent', '请求失败：' + err.message);
  } finally {
    chatSend.disabled = false;
    chatSend.textContent = '发送';
  }
}

chatSend.addEventListener('click', sendChat);
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChat(); });
</script>
