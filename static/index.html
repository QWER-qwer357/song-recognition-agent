<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听歌识曲 · Song Finder</title>
    <style>
        :root {
            --purple: #8b5cf6;
            --pink: #ec4899;
            --blue: #3b82f6;
            --dark: #1e1b4b;
            --text: #1e293b;
            --text-light: #64748b;
            --bg: #faf5ff;
            --card: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #faf5ff 0%, #eff6ff 50%, #f0fdfa 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰光斑 */
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            top: -200px;
            left: -200px;
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 70%);
            bottom: -250px;
            right: -250px;
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 560px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            position: relative;
        }
        .logo svg { width: 32px; height: 32px; color: white; }
        .logo::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(139,92,246,0.4), rgba(236,72,153,0.4));
            z-index: -1;
            filter: blur(12px);
            opacity: 0.6;
        }
        .header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p { font-size: 14px; color: var(--text-light); }

        /* 卡片 */
        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px -10px rgba(139, 92, 246, 0.15), 0 4px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8b5cf6, #ec4899, #3b82f6);
            border-radius: 24px 24px 0 0;
        }

        /* 上传区 */
        .upload-zone {
            border: 2px dashed #e9d5ff;
            border-radius: 16px;
            padding: 44px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #faf5ff 0%, #fdf4ff 100%);
            position: relative;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #8b5cf6;
            background: linear-gradient(135deg, #f3e8ff 0%, #fae8ff 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
        }
        .upload-icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: white;
            border-radius: 50%;
            margin-bottom: 18px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15);
            transition: transform 0.3s ease;
        }
        .upload-zone:hover .upload-icon-wrap { transform: scale(1.1) rotate(-5deg); }
        .upload-icon-wrap svg { width: 32px; height: 32px; color: #8b5cf6; }
        .upload-zone p { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .upload-zone .hint { font-size: 13px; color: var(--text-light); }

        /* 文件信息 */
        .file-info {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }
        .file-info.active { display: flex; }
        .file-info .icon { font-size: 20px; }
        .file-info .name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-info .size { color: var(--text-light); font-size: 12px; background: white; padding: 3px 10px; border-radius: 6px; font-weight: 500; }

        /* 按钮 */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: #fff;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
        }
        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 12px 28px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-primary:disabled {
            background: #e2e8f0;
            box-shadow: none;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .btn svg { width: 18px; height: 18px; }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        .btn.loading .spinner { display: block; }
        .btn.loading svg { display: none; }
        .btn.loading { background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%); cursor: wait; }

        /* 状态提示 */
        .status {
            display: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 16px;
            font-weight: 500;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }
        .status.active { display: flex; }
        .status.processing { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        /* 结果 */
        .result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #faf5ff 0%, #eff6ff 100%);
            border-radius: 16px;
            border: 1px solid #e9d5ff;
            animation: slideIn 0.4s ease;
        }
        .result.active { display: block; }
        .result-title {
            font-size: 13px;
            font-weight: 600;
            color: #8b5cf6;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 15px;
            border-bottom: 1px dashed #e9d5ff;
        }
        .result-row:last-child { border-bottom: none; padding-bottom: 0; }
        .result-row .label { color: var(--text-light); }
        .result-row .value { font-weight: 700; color: var(--text); }
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-cached { background: #dcfce7; color: #15803d; }
        .badge-new { background: #dbeafe; color: #1d4ed8; }

        /* 历史记录 */
        .history-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-title svg { width: 16px; height: 16px; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            background: var(--card);
            border-radius: 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            font-size: 14px;
            animation: slideIn 0.3s ease;
            border-left: 3px solid #8b5cf6;
            transition: transform 0.2s;
        }
        .history-item:hover { transform: translateX(4px); }
        .history-item .song { font-weight: 600; }
        .history-item .score { color: var(--text-light); font-size: 12px; }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: #cbd5e1;
            font-size: 14px;
        }
        .empty-state .emoji { font-size: 32px; display: block; margin-bottom: 10px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                </svg>
            </div>
            <h1>听歌识曲</h1>
            <p>上传一段音频，系统会自动识别出歌曲名称</p>
        </div>

        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon-wrap">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                </div>
                <p>点击选择音频文件，或将文件拖拽到此处</p>
                <p class="hint">支持 mp3、wav 格式</p>
                <input type="file" id="fileInput" accept=".mp3,.wav" style="display: none;">
            </div>

            <div class="file-info" id="fileInfo">
                <span class="icon">🎵</span>
                <span class="name" id="fileName"></span>
                <span class="size" id="fileSize"></span>
            </div>

            <button class="btn btn-primary" id="submitBtn" disabled>
                <span class="spinner"></span>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <span class="btn-text">开始识别</span>
            </button>

            <div class="status" id="status"></div>

            <div class="result" id="result">
                <div class="result-title">✨ 识别结果</div>
                <div class="result-row"><span class="label">歌曲名称</span><span class="value" id="rSongName">-</span></div>
                <div class="result-row"><span class="label">歌手</span><span class="value" id="rArtist">-</span></div>
                <div class="result-row"><span class="label">匹配度</span><span class="value" id="rScore">-</span></div>
                <div class="result-row"><span class="label">状态</span><span class="value" id="rCache"></span></div>
            </div>
        </div>

        <div class="history">
            <div class="history-title">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                识别记录
            </div>
            <div id="historyList">
                <div class="empty-state">
                    <span class="emoji">🎧</span>
                    暂无记录，快去识别一首歌吧
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const historyList = document.getElementById('historyList');

        let selectedFile = null;
        let history = [];

        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault(); uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            fileInfo.classList.add('active');
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
            submitBtn.querySelector('.btn-text').textContent = '开始识别';
            statusDiv.classList.remove('active');
            resultDiv.classList.remove('active');
        }

        function showStatus(type, text) {
            statusDiv.className = 'status active ' + type;
            statusDiv.textContent = text;
        }

        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitBtn.querySelector('.btn-text').textContent = '正在识别...';
            showStatus('processing', '🔍 正在处理，请稍候...');
            resultDiv.classList.remove('active');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/recognize', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.session_id) {
                    pollResult(data.session_id);
                } else if (data.song_name) {
                    showResult(data);
                } else if (data.message) {
                    showStatus('error', '❌ ' + data.message);
                    resetButton();
                } else {
                    showStatus('error', '❌ 识别失败，请稍后重试');
                    resetButton();
                }
            } catch (err) {
                showStatus('error', '❌ 请求失败：' + err.message);
                resetButton();
            }
        });

        function resetButton() {
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
            submitBtn.querySelector('.btn-text').textContent = '开始识别';
        }

        async function pollResult(sessionId) {
            let attempts = 0;
            const timer = setInterval(async () => {
                attempts++;
                try {
                    const res = await fetch('/result/' + sessionId);
                    const data = await res.json();

                    if (data.status === 'completed') {
                        clearInterval(timer);
                        showResult(data.result);
                    } else if (data.status === 'error') {
                        clearInterval(timer);
                        showStatus('error', '❌ 识别出错：' + (data.error || '未知错误'));
                        resetButton();
                    } else if (attempts > 30) {
                        clearInterval(timer);
                        showStatus('error', '⏰ 处理超时，请稍后重试');
                        resetButton();
                    }
                } catch (err) {
                    clearInterval(timer);
                    showStatus('error', '❌ 查询结果失败');
                    resetButton();
                }
            }, 1500);
        }

        function showResult(result) {
            if (!result || !result.song_name) {
                showStatus('error', '😕 未识别到歌曲');
                resetButton();
                return;
            }
            statusDiv.classList.remove('active');
            document.getElementById('rSongName').textContent = result.song_name || '未知';
            document.getElementById('rArtist').textContent = result.artist || '未知';
            document.getElementById('rScore').textContent = result.match_score || '-';
            document.getElementById('rCache').innerHTML = result.cached
                ? '<span class="badge badge-cached">⚡ 来自缓存</span>'
                : '<span class="badge badge-new">🎯 实时识别</span>';
            resultDiv.classList.add('active');
            resetButton();

            history.unshift({ song: result.song_name, score: result.match_score, time: new Date().toLocaleTimeString() });
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) return;
            historyList.innerHTML = history.map(h => `
                <div class="history-item">
                    <span class="song">${h.song}</span>
                    <span class="score">匹配度 ${h.score} · ${h.time}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
